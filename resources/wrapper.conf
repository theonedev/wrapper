#encoding=UTF-8
# Java service configuration. This file must be UTF-8; it is not a shell script.
# Paths default to boot/ (the directory containing the native wrapper binary).
# Commented properties are optional examples. Numbered entries are sorted by their
# numeric suffix, may have gaps, and each supply one value, even with spaces.
# Use ## for a literal hash in a value; a single # starts an inline comment.
# Restart after changing JVM settings. Remove/install the service after changing
# its registered name, display name, description, account, dependencies or script.

# Service identity

# Unique service identifier: Windows SCM name, systemd/SysV name, or launchd label.
# Use up to 128 ASCII letters, digits, dots, underscores or hyphens for portability.
# Default when omitted: java-service.
wrapper.name=my-java-service

# Human-readable Windows service name. Default: wrapper.name; unused on Unix.
wrapper.displayname=My Java Service

# Windows service description and systemd Description. Default: wrapper.name.
# Unused by launchd and SysV.
wrapper.description=My Java application

# Java and application

# Java executable. Default: java on PATH; JAVA_HOME is not consulted automatically.
# Prefer an absolute path for installed services, which do not load shell profiles.
wrapper.java.command=java

# Minimum accepted Java major version. Default: 17; the bridge requires Java 17+.
# Increase this if the application requires a newer Java version.
wrapper.java.version.min=17

# Application class with public static void main(String[] args). For executable
# JARs, use the manifest's Main-Class. The lifecycle bridge is added automatically.
# If omitted or set to io.onedev.wrapper.WrapperSimpleApp, app.parameter.1 must
# contain the application class instead.
wrapper.java.mainclass=com.example.Main

# Application classpath entries, numbered .1, .2, etc. Paths use the working
# directory below. Filename wildcards * and ? are supported, but not recursive
# directory matching. boot/wrapper.jar is always included automatically.
wrapper.java.classpath.1=../lib/*.jar

# One application argument per numbered entry, passed before command-line args.
# Example: --port and its value are separate arguments. Default: no arguments.
#wrapper.app.parameter.1=--port
# Value for the --port argument above.
#wrapper.app.parameter.2=8080

# One JVM option per numbered entry; do not combine several flags in one value.
# Default: no additional JVM options.
#wrapper.java.additional.1=-Dfile.encoding=UTF-8

# Initial heap size in MiB (-Xms). Default: 0, which leaves this JVM option unset.
#wrapper.java.initmemory=128

# Maximum heap size in MiB (-Xmx). Default: 0, which leaves this JVM option unset.
#wrapper.java.maxmemory=1024

# Native library directories, numbered .1, .2, etc., joined into java.library.path.
# Paths use the working directory. No wildcard expansion. Default: JVM's search path.
#wrapper.java.library.path.1=../lib/native

# Append directories from PATH to the configured native library directories.
# Only applies when at least one library.path.N entry is set. Default: FALSE.
#wrapper.java.library.path.append_system_path=FALSE

# JVM working directory, relative to boot/ or absolute. Default: . (boot/).
# Also sets the base for classpath, native library, log and PID paths. If changed,
# update those paths together. Configuration include paths always use boot/.
#wrapper.working.dir=.

# Environment and includes

# set.NAME sets/overrides an environment variable passed to Java; %NAME% expands
# it in property values. Environment names are case-sensitive on Unix only.
#set.APP_MODE=service

# set.default.NAME sets an environment variable only when it is not already set.
# These examples are disabled; enable them and reference %APP_PORT% as needed.
#set.default.APP_PORT=8080

# Read another configuration file; include paths are relative to boot/.
# Optional (missing file ignored): #include ../conf/extra.conf
# Required (missing file is an error): #include.required ../conf/extra.conf

# Service accounts and registration

# Existing Unix account to run as; also accepted as RUN_AS_USER in bin/*.shconf.
# Default: current account (normally root for an installed system service).
# The account needs write access to log/PID directories. Stop and reinstall to change.
#wrapper.daemon.user=myapp

# Unix launcher path, relative to boot/, used for native service registration.
# Default: ../bin/service.sh. Set only when invoking the native binary directly;
# the shell launcher supplies its own path and takes precedence over this property.
#wrapper.script=../bin/service.sh

# Windows startup policy: AUTO_START (default), DELAY_START (delayed automatic),
# or DEMAND_START (manual). Unused on Unix.
wrapper.ntservice.starttype=AUTO_START

# Windows service dependencies, numbered .1, .2, etc. Use a service name or
# +load-order-group; blank entries are ignored. Default: no dependencies.
#wrapper.ntservice.dependency.1=Tcpip

# Windows service account for installation. Empty/omitted uses LocalSystem.
# A custom account needs the right to log on as a service. Unused on Unix.
#wrapper.ntservice.account=DOMAIN\user

# Password for the Windows service account, used only during installation.
# Empty/omitted supplies no password. Restrict access if storing credentials here.
#wrapper.ntservice.password=change-me

# Logging

# Console output: NONE disables application output; other values forward it
# without severity filtering. Default: INFO. Startup errors still reach the caller.
wrapper.console.loglevel=INFO

# JVM stdout/stderr and wrapper log file, relative to the working directory.
# Default: ../logs/console.log. Parent directories are created when needed.
wrapper.logfile=../logs/console.log

# File output: NONE disables it; other values preserve output without filtering.
# Default: INFO. Application-level filtering belongs in the application's logger.
wrapper.logfile.loglevel=INFO

# Rotate at this size: bytes, k (1024 bytes), or m (1024*1024 bytes).
# 0 disables size-based rotation. Wrapper default: 250k; this template uses 10m.
wrapper.logfile.maxsize=10m

# Number of rotated files to retain, in addition to the current file; 0 keeps all.
# Wrapper default: 3; this template keeps 5.
wrapper.logfile.maxfiles=5

# Lifecycle and control

# PID/lock file, relative to the working directory. Default: ../bin/<name>.pid,
# where <name> is wrapper.name. Control files append .control; Unix startup results
# append .startup to the PID filename.
# Choose a writable directory; stop the wrapper before changing this path.
#wrapper.pidfile=../bin/my-java-service.pid

# Timeout in seconds for each Java version probe and JVM bridge startup.
# Default: 30; 0 waits indefinitely. The handshake does not check application readiness.
wrapper.startup.timeout=30

# Maximum seconds for the start command to wait for startup confirmation.
# Default: 120; 0 waits indefinitely. This is separate from the JVM startup timeout.
#wrapper.startup.wait.timeout=120

# Maximum seconds for JVM shutdown, including application hooks, before forced
# termination. Default: 30; 0 allows unlimited normal shutdown. If the supervisor
# is lost, the Java bridge uses a 30-second fallback when this value is 0.
wrapper.shutdown.timeout=30

# Delay in seconds before a JVM-requested restart. Default: 5; 0 restarts immediately.
# Ordinary JVM exits and crashes stop the wrapper; there is no automatic crash retry.
wrapper.restart.delay=5

# Re-read configuration on a JVM-requested restart. Default: TRUE; FALSE retains
# the initial configuration. Service registration changes still need remove/install;
# changing the service account or PID path requires stopping the wrapper first.
#wrapper.restart.reload_configuration=TRUE
