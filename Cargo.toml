[package]
name = "wrapper"
description = "Cross-platform service supervisor for Java applications"
repository = "https://code.onedev.io/onedev/wrapper"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
ctrlc = { version = "3.5", features = ["termination"] }
fs2 = "0.4"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
